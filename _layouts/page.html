---
layout: default
---
<article class="box article">
  <header class="article-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="article-meta">{{ page.subtitle }}</p>{% endif %}
    <span class="pill" aria-hidden="true"></span>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
